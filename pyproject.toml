[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "furiousapi-sqlmodel"
version = "0.0.1-dev.1"
description = "SQL Implementation for FastAPI & FuriousAPI"
readme = "README.md"
requires-python = ">=3.9.5,<=3.13"
authors = [
    { name = "nadobando", email = "7695172+nadobando@users.noreply.github.com" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Framework :: Pydantic",
    "Framework :: FastAPI",
    "Topic :: Database",
    "Topic :: Software Development",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Typing :: Typed"
]
dependencies = [
    "furiousapi-core",
    "pydantic-settings",
    "sqlalchemy>=2.0,<3",
    "sqlmodel>=0.0.1,<1",
]

[project.urls]
Homepage = "https://github.com/nadobando/furiousapi-sqlmodel"
Repository = "https://github.com/nadobando/furiousapi-sqlmodel"
Documentation = "https://nadobando.github.io/furiousapi"

[tool.uv.sources]
furiousapi-core = { workspace=true }

[dependency-groups]
dev = [
    "aiosqlite",
    "asyncpg>=0.29",
    "testcontainers[postgres]>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["furiousapi"]

[tool.autopep8]
aggressive = 3
in-place = true
max_line_length = 120
recursive = true

[tool.bandit.assert_used]
skips = ['**/test_*.py', '**/test_*.py']

[tool.black]
exclude = """
(
  /(
      .eggs
    | .git
    | .hg
    | .mypy_cache
    | .tox
    | .venv
    | venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
"""
include = '\.pyi?$'
line-length = 120
preview = true
target-version = ['py39']

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:"
]

[tool.coverage.run]
branch = true
source = [
    "*/furiousapi/*"
]

[tool.isort]
profile = "black"

[tool.mypy]
check_untyped_defs = true
disable_error_code = "no-redef"
exclude = [
    '\.venv'
]
explicit_package_bases = true
ignore_missing_imports = true
# strict = true
plugins = "pydantic.mypy"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests/test_repository"
disable_error_code = "attr-defined"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.pytest.ini_options]
addopts = "-ra --cov-report=term-missing:skip-covered --cov-report html --cov furiousapi"
testpaths = [
    "tests"
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv"
]
line-length = 120
lint.ignore = [
    "SIM108",
    "UP",
    "D",
    "A003",
    "B008",
    "B905",
    "COM",
    "PLR0913",
    "ANN003",
    "ANN002",
    "EM101",
    "TRY003",
    "UP035",
    "G004",
    "EM102",
    "I001",
    "ANN401",
    "TD",
    "FIX002",
    "E712"
]
lint.fixable = ["ALL"]
lint.extend-safe-fixes = ["T20","ERA00"]
lint.select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "S101", "DTZ001", "PLR0913", "FA100"]
"example/*" = ["INP"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version"
]
version_variables = [
    "furiousapi/sqlmodel/__init__.py:__version__"
]

[tool.semantic_release.branches.dev]
match = "dev"
prerelease = true
prerelease_token = "dev"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    "^ci:.*",
    "^(?!feat:|fix:|perf:|refactor:).*$"
]

[tool.semantic_release.publish]
upload_to_vcs_release = false
